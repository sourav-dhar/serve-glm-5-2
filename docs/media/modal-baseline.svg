<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="t d">
  <title id="t">The proposed GLM-5.2 baseline on Modal</title>
  <desc id="d">One warm replica spans eight H200 GPUs with tensor parallelism eight, native FP8 weights, FP8 KV cache and speculative decoding off. The diagram shows logical ranks, not physical wiring.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2=".6"><stop stop-color="#0b1b21"/><stop offset="1" stop-color="#10292b"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#65968b" opacity=".3"/></pattern>
  </defs>
  <style>
    text {font-family:'Segoe UI',Arial,sans-serif}
    .small,.rank {font-family:Consolas,'Courier New',monospace}
    .small {font-size:14px;letter-spacing:1.2px;fill:#a9cec4}
    .rank {font-size:19px;fill:#d4f5e9}
    .trace {fill:none;stroke:#628e86;stroke-width:2}
    .flow {stroke:#b2fbd5;stroke-width:3;stroke-linecap:round;stroke-dasharray:15 365;animation:travel 3.5s ease-in-out 2}
    @keyframes travel {from {stroke-dashoffset:35} to {stroke-dashoffset:-345}}
    @media (prefers-reduced-motion:reduce) {.flow {animation:none}}
  </style>
  <rect width="960" height="280" rx="12" fill="url(#bg)"/>
  <rect x="430" width="530" height="280" rx="12" fill="url(#dots)"/>
  <path d="M40 40h24" stroke="#abf5cd" stroke-width="3"/>
  <text x="77" y="45" class="small">PROPOSED MODAL BASELINE</text>
  <text x="38" y="112" fill="#effaf5" font-size="54" font-weight="650" letter-spacing="-2">One replica,</text>
  <text x="38" y="171" fill="#a7f3c9" font-size="54" font-weight="650" letter-spacing="-2">eight GPUs.</text>
  <path d="M40 192h383" stroke="#375555"/>
  <text x="40" y="220" fill="#dae8e6" font-size="17">Native FP8 weights · FP8 KV cache</text>
  <text x="40" y="246" fill="#b9ceca" font-size="16">MTP off for the control run</text>
